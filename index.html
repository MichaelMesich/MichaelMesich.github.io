  try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return true;}
  catch(e){flash('Download was blocked in this viewer.');render();return false;}
}
/* Asks where to save when the browser supports it (Chrome/Edge); otherwise falls back to a normal download. cb(ok,how) */
async function dl(name,text,type,cb){
  cb=cb||function(){};
  const ext=(name.match(/\.[a-z0-9]+$/i)||['.txt'])[0].toLowerCase();
  if(window.showSaveFilePicker&&window.top===window.self){
    try{
      const h=await window.showSaveFilePicker({id:'ds-tournaments',suggestedName:name,types:[{description:ext==='.csv'?'CSV file':'Tournament file',accept:{[type]:[ext]}}]});
      const w=await h.createWritable();await w.write(text);await w.close();cb(true,'picked');return;
    }catch(e){if(e&&e.name==='AbortError'){cb(false,'cancel');return;}}
  }
  cb(dlFallback(name,text,type),'download');
}
const slug=()=>(S.name||'tournament').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'tournament';
function tData(T){return {app:'determined-swiss-manager',kind:'tournament',version:1,appVersion:APP_VERSION,savedAt:nowIso(),id:T.id,name:T.name,created:T.created,updated:T.updated,entry:T.entry,sp20Entry:T.sp20Entry,sp2Entry:T.sp2Entry,clubFee:T.clubFee||0,feesSubmitted:!!T.feesSubmitted,feesSubmittedAt:T.feesSubmittedAt||null,feesSubmittedAmt:T.feesSubmittedAmt||0,players:T.players,winners:T.winners,paid:T.paid,nextId:T.nextId,seedsRandomized:!!T.seedsRandomized,numRounds:T.numRounds===5?5:3};}
function markSaved(list){const t=nowIso();list.forEach(x=>{x.dirty=false;x.savedAt=t;});}
function saveT(T){
  dl(slugOf(T.name)+'-'+ymd(T.created)+'.json',JSON.stringify(tData(T),null,2),'application/json',(ok,how)=>{if(ok){markSaved([T]);flash('“'+T.name+'” was saved'+(how==='picked'?'':' to your downloads')+'. Keep the file somewhere safe — it is the only long-term copy.');render();}});
}
function saveAll(){
  const data={app:'determined-swiss-manager',kind:'library',version:1,appVersion:APP_VERSION,savedAt:nowIso(),tournaments:LIB.map(tData)};
  dl('determined-swiss-library-'+ymd(nowIso())+'.json',JSON.stringify(data,null,2),'application/json',(ok)=>{if(ok){markSaved(LIB);flash('All '+LIB.length+' tournament'+(LIB.length===1?'':'s')+' saved in one library file.');render();}});
}
function loadData(d,S){
  if(!d||typeof d!=='object'||!Array.isArray(d.players))throw new Error('Not a tournament file.');
  const ps=d.players.map((p,i)=>({id:Number.isFinite(+p.id)?+p.id:i+1,name:String(p.name==null?'':p.name),sp20:!!p.sp20,sp2:!!p.sp2,director:!!p.director,seed:Number.isFinite(+p.seed)?+p.seed:Math.random()}));
  S.players=ps;S.name=String(d.name||'Determined Swiss');
  S.entry=Number.isFinite(+d.entry)&&+d.entry>=0?+d.entry:40;
  S.sp20Entry=Number.isFinite(+d.sp20Entry)&&+d.sp20Entry>=0?+d.sp20Entry:20;
  S.sp2Entry=Number.isFinite(+d.sp2Entry)&&+d.sp2Entry>=0?+d.sp2Entry:10;
  S.clubFee=Number.isFinite(+d.clubFee)&&+d.clubFee>=0?+d.clubFee:0;
  S.feesSubmitted=!!d.feesSubmitted;S.feesSubmittedAt=typeof d.feesSubmittedAt==='string'?d.feesSubmittedAt:null;S.feesSubmittedAmt=Number.isFinite(+d.feesSubmittedAmt)?+d.feesSubmittedAmt:0;
  S.winners={};if(d.winners&&typeof d.winners==='object')Object.keys(d.winners).forEach(k=>{if(/^[1-5]-\d+$/.test(k)&&Number.isFinite(+d.winners[k]))S.winners[k]=+d.winners[k];});
  S.paid=(d.paid&&typeof d.paid==='object')?d.paid:{};
  S.nextId=Math.max(+d.nextId||0,...ps.map(p=>p.id))+1;
  S.seedsRandomized=!!d.seedsRandomized;S.numRounds=+d.numRounds===5?5:3;return S;
}
function csvStandings(D){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[[S.name+' – Standings & payouts'],['Rank','Name','Side Pool A','Side Pool B','Wins','Losses','Record','Match Wins Payout','Main Prize Bonus','Side Pool A payout','Side Pool B payout','Total']];
  D.standings.forEach(p=>{const r=D.rec[p.id],y=D.pay.per[p.id];rows.push([D.rank[p.id],p.name,p.sp20?'Yes':'',p.sp2?'Yes':'',r.w,r.l,r.w+'-'+r.l,y.win,y.bonus,y.sp,y.spB,y.total]);});
  return rows.map(r=>r.map(q).join(',')).join('\r\n');
}

const moneyS=x=>x<-0.004?'−'+money(-x):money(x);
const feeDirs=()=>S.players.filter(p=>p.director).length;
const feeGross=()=>(S.clubFee||0)*S.players.length;
const feeDeduct=()=>(S.entry||0)*feeDirs();
const feeTotal=()=>feeGross()-feeDeduct();
function feeStatus(D){
  const cf=feeTotal(),sub=S.feesSubmitted,amt=S.feesSubmittedAmt||0;
  if(!(cf>0))return {cf,cls:'ok',short:'— None due',label:'No Club Fees',sub:cf<0?'Net Club Fees are '+moneyS(cf):'Club Fee is $0',html:cf<0?'<b>Nothing to submit.</b> Net Club Fees are '+moneyS(cf)+' (the club fund is covering the director’s entry beyond the Club Fees collected).':'<b>No Club Fees to submit.</b> The Club Fee is $0.'};
  if(sub&&Math.abs(amt-cf)>0.005)return {cf,cls:'warn',short:'⚠ Amount changed',label:'Amount changed',sub:money(amt)+' submitted · now '+money(cf),html:'<b>⚠ Amount changed since submitted.</b> '+money(amt)+' was marked as submitted, but the Club Fees are now '+money(cf)+'. Submit the difference of '+money(cf-amt)+' and re-tick the box.'};
  if(sub)return {cf,cls:'ok',short:'✓ Submitted',label:'Submitted',sub:money(cf)+(S.feesSubmittedAt?' on '+dateLabel(new Date(S.feesSubmittedAt)):''),html:'<b>✓ Submitted to the Treasurer</b> — '+money(cf)+(S.feesSubmittedAt?' on '+esc(dateLabel(new Date(S.feesSubmittedAt))):'')+'.'};
  if(D.status==='Complete')return {cf,cls:'bad',short:'✗ Not submitted',label:'Not submitted',sub:money(cf)+' owed — tournament complete',html:'<b>✗ Not yet submitted.</b> The tournament is complete — '+money(cf)+' in Club Fees is still owed to the Treasurer.'};
  return {cf,cls:'warn',short:'⚠ Not submitted',label:'Not submitted',sub:money(cf)+' due to the Treasurer',html:'<b>Not yet submitted.</b> '+money(cf)+' in Club Fees is due to the Treasurer.'};
}

function chartSvg(D){
  const rows=D.standings.slice(0,60),rh=30,w=640,h=rows.length*rh+34;
  const maxPay=Math.max(1,...rows.map(p=>D.pay.per[p.id].total));
  let s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Wins and payouts per player" style="width:100%;height:auto"><text x="120" y="14" fill="#d9b44a" font-size="11">Wins (gold, of '+D.R+')</text><text x="380" y="14" fill="#86efac" font-size="11">Payout (green)</text>';
  rows.forEach((p,i)=>{
    const y=i*rh+24,r=D.rec[p.id],pay=D.pay.per[p.id].total;
    s+='<text x="112" y="'+(y+11)+'" text-anchor="end" fill="#f6f1de" font-size="12">'+esc(p.name.length>14?p.name.slice(0,13)+'…':p.name)+'</text>';
    s+='<rect x="120" y="'+y+'" width="'+(r.w/D.R*240)+'" height="10" rx="3" fill="#d9b44a"/><text x="'+(126+r.w/D.R*240)+'" y="'+(y+9)+'" fill="#f0d98a" font-size="10">'+r.w+'W</text>';
    s+='<rect x="120" y="'+(y+12)+'" width="'+(pay/maxPay*240)+'" height="8" rx="3" fill="#4ade80"/><text x="'+(126+pay/maxPay*240)+'" y="'+(y+20)+'" fill="#86efac" font-size="10">'+money(pay)+'</text>';
  });
  return s+'</svg>';
}

function sideHtml(D,m,side){
  const s=m[side];
  if(s.bye)return '<div class="prow bye"><span><i class="ck av by">B</i><b>BYE</b> <span class="note">– advances to the next point</span></span><span class="tag blue">auto-win</span></div>';
  if(s.pid!=null){
    const p=D.byId[s.pid],r=D.rec[s.pid],isW=m.winner===s.pid;
    const click=!m.auto&&m.a.pid!=null&&m.b.pid!=null;
    const inner='<span><i class="ck av">'+esc(String(p.name).trim().charAt(0).toUpperCase())+'</i>'+(isW?'🏆 ':'')+esc(p.name)+spTags(p)+'</span><span class="rec num">'+r.w+'–'+r.l+'</span>';
    if(click)return '<button class="prow'+(isW?' win':'')+'" data-act="win" data-m="'+m.id+'" data-p="'+s.pid+'" title="'+(isW?'Click to clear winner':'Set as winner')+'">'+inner+'</button>';
    return '<div class="prow'+(isW?' win':'')+'">'+inner+'</div>';
  }
  return '<div class="prow wait">'+esc(s.label)+'</div>';
}
function matchCard(D,m){

function viewRules(D){
  return '<div class="card rules"><h2>Rules &amp; Help</h2>'+
  '<h3 style="margin-top:14px">Format</h3><p>This is a backgammon match tournament played over '+D.R+' rounds (choose 3 or 5 when you create a tournament, or in Settings before play starts): every pairing is one backgammon match, and the winner advances along the bracket. 4 or more players, unique names (“BYE” is reserved). Everyone plays exactly '+D.R+' rounds, with half the players (rounded up) in each round’s matches — an odd player out gets a BYE. Players are ordered by Seed ascending, ties by ID. Seeds are randomized with the <b>🎲 Roll seeds</b> button on the Players tab (also in Dashboard quick actions). Randomized seeds are stored as fixed values, can still be edited by hand, and are included in the saved tournament file. Randomizing is only allowed before any winner is entered.</p>'+
  '<h3 style="margin-top:14px">Pairings</h3><ul><li><b>Round 1:</b> bracket order, paired 1v2, 3v4… With an odd count the last player gets a BYE (auto-win, no loss).</li>'+
  '<li><b>Round 2:</b> list the R1 winners W1…Wk (the BYE player is Wk) followed by the R1 losers L1…Lm, then pair that list consecutively; an odd list ends with a BYE. Names appear as soon as the feeder match has a winner, otherwise you see “Winner of R1 M4”.</li>'+
  '<li><b>Round 3'+(D.R>3?' onward':'')+':</b> computed by one general slot-based method for any number of players (4 or more): every Round 2 match gives a winner slot and a loser slot, slots are ranked by expected wins (2-0, then 1-1 with bridge matches floating between them, then 0-2) and paired greedily so players who met in Round 1 are not paired again. Slots like W2.3 / L2.3 refer to the winner / loser of Round 2 match 3, so matches become Ready as soon as their feeders finish.'+(D.R>3?' Rounds 4 and 5 repeat the same method using the winner and loser slots of the round before. With 5 rounds, fields under about 32 players (and some odd-sized fields up to about 50) may see repeat opponents in the last rounds; these are flagged “rematch”, and the larger the field the less likely it is.':'')+'</li>'+
  '<li>Tiny fields (4–6 players) use fixed pairings and a rematch may be unavoidable; such a match is flagged “rematch”. With 3 rounds, from 7 players up the method is rematch-free for every set of results. The Round 3 BYE never goes to a slot that could hold a player who already had a BYE. See the <b>Paths</b> sub-tab on Matches for every winner and loser route.</li></ul>'+
  ''+
  '<h3 style="margin-top:14px">Payouts</h3><ul><li>Wins = match wins including BYE wins; Losses = real losses only.</li><li>Match Wins Payout = Wins × ('+(D.R===5?'Entry ÷ 4':'Entry ÷ 2')+').</li><li>Bonus Pool = the total entry money, minus what every match pays out (each match pays '+(D.R===5?'Entry ÷ 4':'Entry ÷ 2')+' to its winner, and there are '+D.R+' rounds of matches — half the players, rounded up, in each round). Players with the best record (most wins, then fewest losses) split it, each getting an equal share, rounded down to the whole dollar. <b>If only one player has the best record</b>, they receive 60% of the Bonus Pool and the other 40% is shared equally among the players with the next-best record (applies to 3 and 5 rounds). Paid only when Complete.</li><li>There are two optional side pools, <b style="color:#f0d98a">Side Pool A</b> (gold) and <b style="color:#a9d8ff">Side Pool B</b> (blue). Each has its own entry fee. A player can be in neither, one or both, ticked on the Players tab. Each pool = its players × its entry, contested only among its own players the same way as the main bonus (best record, ties split equally, rounded down). Paid only when Complete.</li><li>Any leftover few dollars from rounding down is shown on the Payouts tab rather than hidden.</li></ul>'+
  '<h3 style="margin-top:14px">Winner entry</h3><p>Click a player on a Ready match. Click again or press Clear to undo. If a change would invalidate later results, you are warned and those later winners are cleared.</p>'+
  '<h3 style="margin-top:14px">Managing tournaments</h3><ul><li>You can keep several tournaments open at once. Use the dropdown at the top of the page, or the <b>Tournaments</b> tab, to jump between them. Each one keeps its own players, seeds, results and fees while the page stays open.</li>'+

  '<li><b>📂 Open file</b> accepts either kind of file. A single tournament is added and opened; if the same tournament is already here you choose Replace or Keep both. A library file adds all of its tournaments.</li>'+
  '<li>An orange dot means a tournament has changes since it was last saved. The red-gold bar at the top reminds you while anything is unsaved.</li>'+
  '<li><b>Make a copy</b> duplicates the roster, with or without results. <b>Remove</b> only takes a tournament off this page after you confirm; files you saved earlier are not touched.</li>'+
  '<li>Randomize seeds, matches, standings, payouts, print and CSV always work on the tournament that is open.</li></ul></div>'+
  '<div class="card" style="margin-top:16px"><h3>Start a new tournament</h3><p class="note">There is no auto-archive and nothing is auto-saved — <b>save the tournament file first</b>.</p><div class="row" style="margin-top:10px"><button class="btn gold" data-act="save">💾 Save this tournament</button><button class="btn danger" data-act="clrwin">Clear all winners</button><button class="btn danger" data-act="clrall">Clear players &amp; winners</button></div></div>'+
  prizeCharts()+offlineCard()+changelogCard()+'<div class="card" style="margin-top:16px"><h3>About &amp; Credits</h3><p><b>Determined Swiss Format Tournament Generator</b> — '+D.R+' rounds where winners play winners and losers play losers, with floats connecting the pools, so everyone plays every round.</p><p>Digital Implementation by <b>Michael Mesich</b> - Based on a format idea from <b>Steve Reichelt</b></p><p class="note">If you’re a Tournament Director and this tool helped your event, feel free to kick a little something back to Venmo @mmesich — thank you!</p><p><a class="btn gold sm" href="https://venmo.com/u/mmesich" target="_blank" rel="noopener noreferrer">Venmo @mmesich</a></p></div>';

function randomNames(n){

function importData(d,fn){

  askConfirm('Reloading will wipe out unsaved changes in '+n+' tournament'+(n===1?'':'s')+'. Choose Cancel, then use Save this tournament (or Save all tournaments) first.','Reload anyway',function(){allowUnload=true;location.reload();});
});
/* ---------- Actions ---------- */
function setWinner(mid,pid){
  const nw=Object.assign({},S.winners);
  if(pid==null)delete nw[mid];else nw[mid]=pid;
  const c=cleanWinners(S.players,nw,S.numRounds);
  const apply=()=>commit(()=>{S.winners=c.winners;});
  if(c.removed.length){
    askConfirm('This change invalidates '+c.removed.length+' later winner entr'+(c.removed.length>1?'ies':'y')+' (match '+c.removed.join(', ')+'). They will be cleared. Continue?','Change & clear later winners',apply);
  }else apply();
}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,D=ui.D;
  switch(a){
    case 'dlcopy':downloadCopy();break;
    case 'installapp':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;render();});}break;
    case 'changelog':if(ui.welcome){ui.showLog=!ui.showLog;render();setTimeout(()=>{const c=$('changelog-card');if(c)c.scrollIntoView({behavior:'smooth'});},50);break;}ui.tab='rules';render();setTimeout(()=>{const c=$('changelog-card');if(c)c.scrollIntoView({behavior:'smooth'});},50);break;
    case 'tab':ui.tab=el.dataset.v;render();window.scrollTo(0,0);break;
    case 'mr':ui.mRound=el.dataset.v;render();break;
    case 'mf':ui.mFilter=el.dataset.v;render();break;
    case 'hl':{const id=+el.dataset.p;ui.hl=ui.hl===id?null:id;render();break;}
    case 'sbpay':ui.sbPay=!ui.sbPay;render();break;
    case 'sbopen':ui.sbOpen=!ui.sbOpen;render();break;
    case 'gomatch':ui.tab='matches';ui.mRound=el.dataset.r;render();window.scrollTo(0,0);break;
    case 'gopay':ui.tab='payouts';render();window.scrollTo(0,0);break;
    case 'win':{const m=el.dataset.m,pid=+el.dataset.p;setWinner(m,S.winners[m]===pid?null:pid);break;}
    case 'clearw':setWinner(el.dataset.m,null);break;
    case 'save':saveT(S);break;
    case 'saveall':saveAll();break;
    case 'tnew':ui.modal={type:'new'};render();window.scrollTo(0,0);break;
    case 'topen':ui.tab='dashboard';switchTo(el.dataset.id);window.scrollTo(0,0);break;
    case 'tsave':{const T=LIB.find(x=>x.id===el.dataset.id);if(T)saveT(T);break;}
    case 'trenameopen':ui.modal={type:'rename',id:el.dataset.id};render();window.scrollTo(0,0);break;
    case 'tcopyopen':ui.modal={type:'copy',id:el.dataset.id};render();window.scrollTo(0,0);break;
    case 'mclose':ui.modal=null;render();break;
    case 'tremove':{const T=LIB.find(x=>x.id===el.dataset.id);if(!T)break;askConfirm('Remove “'+T.name+'” from this page? '+(T.dirty?'It has unsaved changes that will be lost. ':'')+'Files you saved earlier are not deleted.','Remove tournament',()=>{const i=LIB.indexOf(T);LIB.splice(i,1);if(!LIB.length){const ph=mkT({name:'New tournament',entry:T.entry,sp20Entry:T.sp20Entry});ph.placeholder=true;LIB.push(ph);ui.welcome=true;ui.tab='dashboard';}if(S===T){S=LIB[Math.min(i,LIB.length-1)];ui.seedToast=null;}flash('Removed “'+T.name+'”.');render();});break;}
    case 'tcreate':{
      const nm=($('nt-name-3c7v').value||'').trim()||defaultName();
      const mode=(document.querySelector('input[name="nt-mode"]:checked')||{}).value;
      let ps=[],nid=1;
      if(mode==='copy'){const src=LIB.find(x=>x.id===$('nt-src-9d2k').value);if(src){ps=JSON.parse(JSON.stringify(src.players));nid=src.nextId;}}
      else if(mode==='paste'){const names=$('nt-paste-6p4w').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);ps=names.map((x,i)=>({id:i+1,name:x,sp20:false,director:false,seed:Math.random()}));nid=names.length+1;}
      const nr=+((document.querySelector('input[name="nt-rounds"]:checked')||{}).value)===5?5:3;
      const fv=(id,d)=>{const v=parseFloat(($(id)||{}).value);return Number.isFinite(v)&&v>=0?v:d;};
      const T=mkT({name:nm,entry:fv('nt-entry-1a7p',nr===5?60:40),sp20Entry:fv('nt-sp-2b8q',nr===5?30:20),sp2Entry:fv('nt-sp2-4d1s',nr===5?15:10),clubFee:fv('nt-club-3c9r',nr===5?10:5),players:ps,nextId:nid,numRounds:nr,dirty:true});
      dropPlaceholder();LIB.push(T);ui.tab='players';switchTo(T.id);flash('Created “'+T.name+'” with '+ps.length+' player'+(ps.length===1?'':'s')+'. Remember to save it to a file.');render();window.scrollTo(0,0);break;
    }
    case 'trename':{const T=LIB.find(x=>x.id===ui.modal.id),nm=($('rn-name-8b1q').value||'').trim();if(!nm){flash('Enter a name first.');render();break;}if(T){T.name=nm;T.dirty=true;T.updated=nowIso();}ui.modal=null;render();break;}
    case 'tcopy':{
      const src=LIB.find(x=>x.id===ui.modal.id);if(!src){ui.modal=null;render();break;}
      const nm=($('cp-name-2x8r').value||'').trim()||(src.name+' (copy)');
      const res=(document.querySelector('input[name="cp-mode"]:checked')||{}).value==='results';
      const c=JSON.parse(JSON.stringify(src));
      const T=mkT({name:nm,entry:c.entry,sp20Entry:c.sp20Entry,sp2Entry:c.sp2Entry,clubFee:c.clubFee,players:c.players,winners:res?c.winners:{},paid:res?c.paid:{},nextId:c.nextId,seedsRandomized:c.seedsRandomized,numRounds:c.numRounds,dirty:true});
      LIB.push(T);ui.modal=null;flash('Added “'+T.name+'” ('+(res?'roster with results':'roster only')+'). Remember to save it to a file.');render();break;
    }
    case 'mreplace':{const m=ui.modal,i=LIB.findIndex(x=>x.id===m.T.id);if(i>=0)LIB[i]=m.T;else LIB.push(m.T);switchTo(m.T.id);flash('Replaced the tournament with the version from “'+m.fn+'”.');render();break;}
    case 'mkeep':{const m=ui.modal;m.T.id=newId();m.T.name+=' (imported)';LIB.push(m.T);switchTo(m.T.id);flash('Kept both: the file’s version was added as “'+m.T.name+'”.');render();break;}
    case 'ntsample':{const n=Math.max(1,Math.min(5000,parseInt($('nt-n-4h8z').value,10)||0));$('nt-paste-6p4w').value=randomNames(n).join('\n');const rb=document.querySelector('input[name="nt-mode"][value="paste"]');if(rb)rb.checked=true;break;}
    case 'open':openPicker();break;
    case 'csv':dl(slug()+'-standings-payouts.csv',csvStandings(D),'text/csv');break;
    case 'print':document.title=S.name+' – Cash-out sheet';try{window.print();document.title=S.name+' – Backgammon Determined Swiss Tournament Manager';}catch(err){flash('Printing is blocked in this viewer. Use Export CSV instead.');render();}break;
    case 'printpaths':try{window.print();}catch(err){flash('Printing is blocked in this viewer.');render();}break;
    case 'dismissbanner':ui.banner=false;render();break;
    case 'dismissmsg':ui.msg='';render();break;
    case 'cancelconfirm':ui.confirm=null;render();break;
    case 'doconfirm':{const f=ui.confirm&&ui.confirm.fn;ui.confirm=null;if(f)f();else render();break;}
    case 'shuffle':if(!playBegun())commit(()=>{S.players.forEach(p=>p.seed=Math.random());});break;
    case 'randseeds':randomizeSeeds();break;
    case 'seedagain':if(!playBegun())doRandomize(true);break;
    case 'seedundo':undoSeeds();break;
    case 'seedclose':ui.seedToast=null;render();break;
    case 'sortseed':commit(()=>{S.players.sort((a,b)=>a.seed-b.seed||a.id-b.id);});break;
    case 'add':{const inp=$('add-name-5h8e');const nm=(inp.value||'').trim();if(!nm){flash('Enter a name first.');render();break;}commit(()=>{S.players.push({id:S.nextId++,name:nm,sp20:false,director:false,seed:Math.random()});ui.newName='';});break;}
    case 'paste':{const names=$('paste-box-1r6t').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!names.length)break;commit(()=>{names.forEach(nm=>S.players.push({id:S.nextId++,name:nm,sp20:false,director:false,seed:Math.random()}));ui.paste='';});break;}
    case 'del':{const id=+el.dataset.p;if(!playBegun())commit(()=>{S.players=S.players.filter(p=>p.id!==id);delete S.paid[id];});break;}
    case 'clrwin':askConfirm('Clear ALL winner entries? Players stay. Save the file first if you need this tournament.','Clear all winners',()=>commit(()=>{S.winners={};S.paid={};}));break;
    case 'clrall':askConfirm('Remove ALL players and winners? Save the tournament file first — nothing is archived automatically.','Clear players & winners',()=>commit(()=>{S.players=[];S.winners={};S.paid={};S.nextId=1;}));break;
  }
});
document.addEventListener('change',function(e){
  if(e.target.name==='nt-rounds'){const five=e.target.value==='5',d=[['nt-entry-1a7p',five?60:40],['nt-sp-2b8q',five?30:20],['nt-sp2-4d1s',five?15:10],['nt-club-3c9r',five?10:5]];d.forEach(x=>{const f=$(x[0]);if(f&&f.dataset.edited!=='1')f.value=x[1];});return;}
  if(e.target.id==='tsw-5n2j'){switchTo(e.target.value);return;}if(e.target.id==='path-pl-7q2m'){ui.pathPid=+e.target.value;render();return;}const el=e.target.closest('[data-ch]');if(!el)return;
  const k=el.dataset.ch,pid=+el.dataset.p,pl=S.players.find(p=>p.id===pid);
  if(k==='pname'&&pl)commit(()=>{pl.name=el.value.trim();});
  else if(k==='pflag'&&pl)commit(()=>{pl[el.dataset.f]=el.checked;});
  else if(k==='pseed'&&pl){const v=parseFloat(el.value);if(Number.isFinite(v)&&!playBegun())commit(()=>{pl.seed=v;});else render();}
  else if(k==='feesub')commit(()=>{S.feesSubmitted=el.checked;S.feesSubmittedAt=el.checked?nowIso():null;S.feesSubmittedAmt=el.checked?feeTotal():0;});
  else if(k==='paid')commit(()=>{if(el.checked)S.paid[pid]=true;else delete S.paid[pid];});
  else if(k==='set'){
    const f=el.dataset.k;
    if(f==='name')commit(()=>{S.name=el.value.trim()||'Determined Swiss';});
    else if(f==='numRounds'){if(!playBegun())commit(()=>{S.numRounds=+el.value===5?5:3;});else render();}
    else{const v=parseFloat(el.value);if(Number.isFinite(v)&&v>=0)commit(()=>{S[f]=v;});else render();}
  }
});
document.addEventListener('input',function(e){
  if(e.target.classList&&e.target.classList.contains('ntfee'))e.target.dataset.edited='1';
  if(e.target.id==='paste-box-1r6t')ui.paste=e.target.value;
  if(e.target.id==='add-name-5h8e')ui.newName=e.target.value;
  if(e.target.id==='msearch-3k9p'){ui.mSearch=e.target.value;const pos=e.target.selectionStart;render();const n=$('msearch-3k9p');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='add-name-5h8e'){e.preventDefault();const b=document.querySelector('[data-act="add"]');if(b)b.click();}
});
function readTextFile(f){
  const rd=new FileReader();
  rd.onload=function(){
    try{importData(JSON.parse(String(rd.result)),f.name);}
    catch(err){flash('Could not open “'+f.name+'”: '+(err instanceof SyntaxError?'it is not a valid tournament file (the contents could not be read).':err.message));}
    render();
  };
  rd.onerror=function(){flash('Could not read that file.');render();};
  rd.readAsText(f);
}
/* Uses the browser's file picker (remembers the last folder) where supported; otherwise the standard file chooser. */
async function openPicker(){
  if(window.showOpenFilePicker&&window.top===window.self){
    try{
      const hs=await window.showOpenFilePicker({id:'ds-tournaments',multiple:false,types:[{description:'Tournament file',accept:{'application/json':['.json']}}]});
      if(hs&&hs[0])readTextFile(await hs[0].getFile());
      return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  $('openfile-7k2d').click();
}
$('openfile-7k2d').addEventListener('change',function(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=function(){
    try{importData(JSON.parse(String(rd.result)),f.name);}
    catch(err){flash('Could not open “'+f.name+'”: '+(err instanceof SyntaxError?'it is not a valid tournament file (the contents could not be read).':err.message));}
    e.target.value='';render();
  };
  rd.onerror=function(){flash('Could not read that file.');render();};
  rd.readAsText(f);
});
render();
})();
