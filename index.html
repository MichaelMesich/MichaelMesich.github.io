const STATUS_HELP={'Ready':'Both players are known, so this match can be played now. Click the winner when it finishes.','Waiting':'One or both players are still waiting for an earlier match to finish.','Complete':'A winner has been entered for this match.','BYE – Advanced':'No opponent this round because there is an odd number of players. The player gets an automatic win.','Forfeit – Advanced':'The opponent withdrew from the tournament, so this player wins automatically and moves on.','Voided':'Both players withdrew (or a withdrawn player had a BYE), so nobody gets a win or a loss.','Check entry':'A saved winner no longer fits this match because an earlier result was changed. Clear it and choose the winner again.'};
function glossaryHtml(){return '<ul class="gloss">'+
 '<li><b>Ready</b> — both players are known; the match can be played now.</li>'+
 '<li><b>Waiting</b> — still waiting for an earlier match to finish. “Winner of R1 M4” means whoever wins Round 1 match 4.</li>'+
 '<li><b>Complete</b> — a winner has been entered.</li>'+
 '<li><b>BYE</b> — no opponent this round (odd number of players). It counts as an automatic win, never a loss.</li>'+
 '<li><b>Forfeit</b> — the opponent withdrew, so this player wins automatically (and gets the usual win payout). Shown as “Win by forfeit”.</li>'+
 '<li><b>Withdrew</b> — a player who has left the event. Their remaining matches become forfeits for their opponents.</li>'+
 '<li><b>Voided</b> — both players withdrew, so the match is skipped and nobody gets a win or loss.</li>'+

function payWhy(D,x){
  const p=D.pay,y=p.per[x.id],r=D.rec[x.id],b=[];

  b.push(r.w+' win'+(r.w===1?'':'s')+' × '+money(p.win)+' = '+money(y.win));
  if(y.bonus>0){
    if(p.lead.includes(x.id)){
      if(p.lead.length===1&&p.lead2.length)b.push('Main bonus: the only player with the best record ('+r.w+'–'+r.l+'), so 60% of the '+money(p.bonusPool)+' bonus pool');
      else b.push('Main bonus: best record ('+r.w+'–'+r.l+'), '+(p.lead.length>1?'tied with '+(p.lead.length-1)+' other'+(p.lead.length>2?'s':'')+', so the '+money(p.bonusPool)+' pool is shared '+p.lead.length+' ways':'so the whole '+money(p.bonusPool)+' pool')+' (rounded down)');
    }else if(p.lead2.includes(x.id))b.push('Main bonus: next-best record ('+r.w+'–'+r.l+'); the other 40% ('+money(Math.trunc(p.bonusPool*0.4))+') is shared '+p.lead2.length+' way'+(p.lead2.length>1?'s':'')+' (rounded down)');
  }
  if(y.sp>0)b.push('Side Pool A: best record among Side Pool A players ('+sh(p.spLead.length)+' of '+money(p.spPoolA)+')');
  if(y.spB>0)b.push('Side Pool B: best record among Side Pool B players ('+sh(p.spLeadB.length)+' of '+money(p.spPoolB)+')');
  return b.join(' · ');
}

function viewRules(D){
  return '<div class="card rules"><h2>Rules &amp; Help</h2>'+
  '<p class="note">This tournament is a <b>'+D.R+'-round</b> event. The rules below cover both the 3-round and the 5-round format, and say which one they apply to.</p>'+
  '<h3 style="margin-top:14px">Format</h3><ul>'+
  '<li><b>Rounds:</b> choose 3 or 5 rounds when you create a tournament, or in Settings before play starts. Every pairing is one backgammon match. Everyone plays in every round.</li>'+
  '<li><b>Players:</b> 4 or more, each with a unique name (“BYE” is reserved). In each round half the players, rounded up, play matches. With an odd number of players, one player gets a BYE, which counts as a win and never as a loss.</li>'+
  '<li><b>Which format?</b> 3 rounds suits smaller fields. 5 rounds works best with 32 or more players; smaller fields may meet the same opponent again in the last rounds (flagged “rematch”).</li>'+
  '<li><b>Seeding:</b> players are ordered by Seed, then by ID. Use <b>🎲 Roll seeds</b> on the Players tab (also in the Dashboard quick actions) to randomize. Seeds can still be edited by hand and are saved in the tournament file. Rolling is only allowed before any winner is entered.</li></ul>'+
  '<h3 style="margin-top:14px">Pairings</h3><ul>'+
  '<li><b>Round 1:</b> bracket order: player 1 v 2, 3 v 4, and so on. With an odd number of players the last player gets the BYE.</li>'+
  '<li><b>Round 2:</b> the Round 1 winners are listed first (the BYE player counts as a winner), followed by the Round 1 losers, and neighbours on that list play each other. An odd list ends with a BYE. A name appears as soon as its earlier match has a winner; until then you see “Winner of R1 M4”.</li>'+
  '<li><b>Round 3 (both formats):</b> every Round 2 match produces a winner slot and a loser slot. Slots are ranked by how many wins they are expected to hold, then paired so that players who already met are kept apart. Slots such as W2.3 and L2.3 mean the winner and loser of Round 2 match 3, so a match becomes Ready as soon as the matches feeding it are finished.</li>'+
  '<li><b>Rounds 4 and 5 (5-round format only):</b> the same method is repeated, using the winner and loser slots of the round before.</li>'+
  '<li><b>Repeat opponents:</b> in the 3-round format, from 7 players up nobody meets the same opponent twice, whatever the results. Very small fields (4 to 6 players) use fixed pairings, so a rematch can be unavoidable. In the 5-round format, fields under about 32 players (and some odd-sized fields up to about 50) may have rematches in the last rounds; the larger the field, the less likely this is. Rematches are flagged “rematch”.</li>'+
  '<li><b>BYEs:</b> a later BYE never goes to a slot that could hold a player who already had one. Open the <b>Paths</b> sub-tab on Matches to see every possible winner and loser route.</li></ul>'+
  '<h3 style="margin-top:14px">Payouts</h3><ul>'+
  '<li><b>Wins and losses:</b> Wins include BYE wins. Losses are real losses only.</li>'+
  '<li><b>Match win payout:</b> every match win pays a fixed amount: <b>Entry ÷ 2</b> in a 3-round tournament, or <b>Entry ÷ 4</b> in a 5-round tournament. For example, on a $40 entry that is $20 per win in 3 rounds, or $10 per win in 5 rounds.</li>'+
  '<li><b>Bonus Pool:</b> all the entry money, minus what the matches pay out (each match pays one win payout, and each round has half the players, rounded up, in matches). Whatever is left is the Bonus Pool.</li>'+
  '<li><b>Who wins the Bonus Pool:</b> the best record is the most wins, then the fewest losses. <b>If two or more players tie for the best record</b>, they split the pool equally. <b>If only one player has the best record</b>, that player gets 60% and the other 40% is shared equally among the players with the next-best record. Shares are rounded down to a whole dollar. This works the same in 3 and 5 rounds.</li>'+
  '<li><b>Side Pools:</b> there are two optional side pools, <b style="color:#f0d98a">Side Pool A</b> (gold) and <b style="color:#a9d8ff">Side Pool B</b> (blue), each with its own entry fee. A player can be in neither, one or both (tick them on the Players tab). Each pool is its players × its entry fee and is won only by its own players: the best record takes the whole pool, and ties split it equally, rounded down. The 60/40 rule does not apply to side pools.</li>'+
  '<li><b>When money is paid:</b> the Bonus Pool and the Side Pools are paid only when every match has a winner (Complete). Before then, Standings shows projected amounts in gold.</li>'+
  '<li><b>Rounding:</b> any leftover dollars from rounding down are shown on the Payouts tab rather than hidden, and the Cash check there confirms every dollar is accounted for.</li></ul>'+
  '<h3 style="margin-top:14px">Club Fee</h3><ul>'+
  '<li>The Club Fee is a separate per-player amount that goes to the club, not into the prizes. Set it in Settings or in the New tournament dialog.</li>'+
  '<li><b>Net Club Fees</b> = Club Fee × number of players − (Entry fee × number of players marked as Director). In other words, the club pays the Director’s entry out of the Club Fees. Mark the Director on the Players tab; the Dashboard warns if nobody is marked.</li>'+
  '<li>Tick “submitted to the Treasurer” on the Dashboard or the Payouts tab once the fee has been handed over. The card is green when submitted, amber while the tournament is still running, and red if the tournament is complete and it has not been submitted.</li></ul>'+
  '<h3 style="margin-top:14px">What the labels mean</h3>'+glossaryHtml()+
  '<h3 style="margin-top:14px">Winner entry</h3><p>Click a player on a Ready match. Click again or press Clear to undo. If a player does not show up for a match, simply click their opponent as the winner. If a change would invalidate later results, you are warned and those later winners are cleared.</p>'+
  '<h3 style="margin-top:14px">Withdrawing a player</h3><ul><li>Once winners have been entered, the Players tab has a <b>⏏ Withdraw</b> button for a player who leaves the event. It can be undone.</li><li>All of that player’s remaining matches become <b>forfeits</b>: each opponent wins automatically, advances at once, and sees “Win by forfeit” on the match card, so they know before they sit down.</li><li>A forfeit win counts as a normal win and pays the usual match win amount. The withdrawn player takes a loss for each forfeit. Their entry fee is not refunded and the Club Fee is still charged. Results already entered stay as they are.</li><li>If two withdrawn players would meet, or a withdrawn player would get a BYE, that match is <b>voided</b>: nobody gets a win or a loss, and the win money that would have been paid goes into the Bonus Pool instead.</li><li>If a player only misses one match, just click their opponent as the winner. They are paired normally in the next round.</li></ul>'+
  '<h3 style="margin-top:14px">Managing tournaments</h3><ul><li>You can keep several tournaments open at once. Use the dropdown at the top of the page, or the <b>Tournaments</b> tab, to jump between them. Each one keeps its own players, seeds, results and fees while the page stays open.</li>'+
  '<li><b>Nothing is stored in your browser.</b> Tournaments live in this page’s memory only. If you close or reload the page, anything you have not saved to a file is gone.</li>'+
  '<li><b>💾 Save this tournament</b> downloads one file for the open tournament. In Chrome and Edge, after the first save, pressing Save again overwrites that same file in one tap; use <b>Save as new file…</b> on the Dashboard to start a new file.</li><li><b>Save reminder:</b> after every few results (you choose 3, 5 or 10, or off, on the Dashboard) a banner reminds you to save. Nothing is saved automatically.</li><li><b>💾 Save all tournaments</b> downloads one library file with everything.</li>'+
  '<li><b>📂 Open file</b> accepts either kind of file. A single tournament is added and opened; if the same tournament is already here you choose Replace or Keep both. A library file adds all of its tournaments.</li>'+
  '<li>An orange dot means a tournament has changes since it was last saved. The red-gold bar at the top reminds you while anything is unsaved.</li>'+
  '<li><b>Make a copy</b> duplicates the roster, with or without results. <b>Remove</b> only takes a tournament off this page after you confirm; files you saved earlier are not touched.</li>'+
  '<li>Randomize seeds, matches, standings, payouts, print and CSV always work on the tournament that is open.</li></ul></div>'+
  prizeCharts()+offlineCard()+changelogCard()+'<div class="card" style="margin-top:16px"><h3>About &amp; Credits</h3><p><b>Determined Swiss Format Tournament Generator</b> — '+D.R+' rounds where winners play winners and losers play losers, with floats connecting the pools, so everyone plays every round.</p><p>Digital Implementation by <b>Michael Mesich</b> - Based on a format idea from <b>Steve Reichelt</b></p><p class="note">If you’re a Tournament Director and this tool helped your event, feel free to kick a little something back to Venmo @mmesich — thank you!</p><p><a class="btn gold sm" href="https://venmo.com/u/mmesich" target="_blank" rel="noopener noreferrer">Venmo @mmesich</a></p></div>';
}

function prizeCharts(){
  const N=16,ents=[40,60,100],m=v=>'$'+(Math.round(v*100)/100).toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(Math.round(v*100)/100)?0:2,maximumFractionDigits:2});
  const pool=(n,e,R)=>n*e-R*ceil2(n)*e*winFrac(R),tie=(n,R)=>R===3?n>=15:n>=63,dash='<span class="note">—</span>';
  const one=R=>{

    ents.forEach(e=>{const w=e*winFrac(R),bp=pool(N,e,R);

      dropPlaceholder();LIB.push(T);ui.tab='players';switchTo(T.id);flash('Created “'+T.name+'” with '+ps.length+' player'+(ps.length===1?'':'s')+'. Remember to save it to a file.');render();window.scrollTo(0,0);break;
    }
    case 'trename':{const T=LIB.find(x=>x.id===ui.modal.id),nm=($('rn-name-8b1q').value||'').trim();if(!nm){flash('Enter a name first.');render();break;}if(T){T.name=nm;T.dirty=true;T.updated=nowIso();}ui.modal=null;render();break;}
    case 'tcopy':{
      const src=LIB.find(x=>x.id===ui.modal.id);if(!src){ui.modal=null;render();break;}
      const nm=($('cp-name-2x8r').value||'').trim()||(src.name+' (copy)');
      const res=(document.querySelector('input[name="cp-mode"]:checked')||{}).value==='results';
      const c=JSON.parse(JSON.stringify(src));
      const T=mkT({name:nm,entry:c.entry,sp20Entry:c.sp20Entry,sp2Entry:c.sp2Entry,clubFee:c.clubFee,players:(res?c.players:c.players.map(p=>Object.assign({},p,{withdrawn:false}))),winners:res?c.winners:{},paid:res?c.paid:{},nextId:c.nextId,seedsRandomized:c.seedsRandomized,numRounds:c.numRounds,clubName:c.clubName,dirty:true});
      LIB.push(T);ui.modal=null;flash('Added “'+T.name+'” ('+(res?'roster with results':'roster only')+'). Remember to save it to a file.');render();break;
    }
    case 'mreplace':{const m=ui.modal,i=LIB.findIndex(x=>x.id===m.T.id);if(i>=0)LIB[i]=m.T;else LIB.push(m.T);switchTo(m.T.id);flash('Replaced the tournament with the version from “'+m.fn+'”.');render();break;}
    case 'mkeep':{const m=ui.modal;m.T.id=newId();m.T.name+=' (imported)';LIB.push(m.T);switchTo(m.T.id);flash('Kept both: the file’s version was added as “'+m.T.name+'”.');render();break;}
    case 'ntsample':{const n=Math.max(1,Math.min(5000,parseInt($('nt-n-4h8z').value,10)||0));$('nt-paste-6p4w').value=randomNames(n).join('\n');const rb=document.querySelector('input[name="nt-mode"][value="paste"]');if(rb)rb.checked=true;break;}
    case 'open':openPicker();break;
    case 'share':ui.shareOpen=true;ui.shareMsg='';render();break;
    case 'shareclose':ui.shareOpen=false;ui.shareMsg='';render();break;
    case 'sharepng':sharePng(D,false);break;
    case 'sharenative':sharePng(D,true);break;
    case 'sharecopy':shareCopy(D);break;
    case 'csv':dl(slug()+'-standings-payouts.csv',csvStandings(D),'text/csv');break;
    case 'print':document.title=S.name+' – Cash-out sheet';try{window.print();document.title=S.name+' – Backgammon Determined Swiss Tournament Manager';}catch(err){flash('Printing is blocked in this viewer. Use Export CSV instead.');render();}break;
    case 'printpaths':try{window.print();}catch(err){flash('Printing is blocked in this viewer.');render();}break;
    case 'dismissbanner':ui.banner=false;render();break;
    case 'dismissmsg':ui.msg='';render();break;
    case 'cancelconfirm':ui.confirm=null;render();break;
    case 'doconfirm':{const f=ui.confirm&&ui.confirm.fn;ui.confirm=null;if(f)f();else render();break;}
    case 'shuffle':if(!playBegun())commit(()=>{S.players.forEach(p=>p.seed=Math.random());});break;
    case 'randseeds':randomizeSeeds();break;
    case 'seedagain':if(!playBegun())doRandomize(true);break;
    case 'seedundo':undoSeeds();break;
    case 'seedclose':ui.seedToast=null;render();break;
    case 'sortseed':commit(()=>{S.players.sort((a,b)=>a.seed-b.seed||a.id-b.id);});break;
    case 'add':{const inp=$('add-name-5h8e');const nm=(inp.value||'').trim();if(!nm){flash('Enter a name first.');render();break;}commit(()=>{S.players.push({id:S.nextId++,name:nm,sp20:false,director:false,seed:Math.random()});ui.newName='';});break;}
    case 'paste':{const names=$('paste-box-1r6t').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!names.length)break;commit(()=>{names.forEach(nm=>S.players.push({id:S.nextId++,name:nm,sp20:false,director:false,seed:Math.random()}));ui.paste='';});break;}
    case 'withdraw':{const id=+el.dataset.p,pl=S.players.find(p=>p.id===id);if(!pl)break;askConfirm('Withdraw '+pl.name+'? All of their remaining matches become forfeits, and each waiting opponent gets an automatic win. Their entry fee and the Club Fee are not refunded. You can undo this later.','Withdraw '+pl.name,()=>commit(()=>{pl.withdrawn=true;}));break;}
    case 'unwithdraw':{const id=+el.dataset.p,pl=S.players.find(p=>p.id===id);if(!pl)break;
      const test=S.players.map(p=>p.id===id?Object.assign({},p,{withdrawn:false}):p),c=cleanWinners(test,S.winners,S.numRounds);
      const go=()=>commit(()=>{pl.withdrawn=false;S.winners=c.winners;});
      if(c.removed.length)askConfirm('Undoing this withdrawal changes later matches, so '+c.removed.length+' winner entr'+(c.removed.length>1?'ies':'y')+' (match '+c.removed.join(', ')+') will be cleared. Continue?','Undo withdrawal',go);else go();break;}
    case 'del':{const id=+el.dataset.p;if(!playBegun())commit(()=>{S.players=S.players.filter(p=>p.id!==id);delete S.paid[id];});break;}
    case 'clrwin':askConfirm('Clear ALL winner entries? Players stay. Save the file first if you need this tournament.','Clear all winners',()=>commit(()=>{S.winners={};S.paid={};}));break;
    case 'clrall':askConfirm('Remove ALL players and winners? Save the tournament file first — nothing is archived automatically.','Clear players & winners',()=>commit(()=>{S.players=[];S.winners={};S.paid={};S.nextId=1;}));break;
  }
});
document.addEventListener('change',function(e){
  const shk=e.target.dataset&&e.target.dataset.sh;
  if(shk){const o=shareOpts();if(shk==='club'){commit(()=>{S.clubName=e.target.value.trim().slice(0,60);});}else if(shk==='amt'){o.amt=e.target.checked;render();}else{o[shk]=shk==='top'&&e.target.value!=='all'?+e.target.value:e.target.value;render();}return;}
  if(e.target.name==='nt-rounds'){const five=e.target.value==='5',d=[['nt-entry-1a7p',five?60:40],['nt-sp-2b8q',five?30:20],['nt-sp2-4d1s',five?15:10],['nt-club-3c9r',five?10:5]];d.forEach(x=>{const f=$(x[0]);if(f&&f.dataset.edited!=='1')f.value=x[1];});return;}
  if(e.target.id==='remind-7x3k'){ui.remindEvery=+e.target.value;LIB.forEach(T=>{T.nextRemind=(T.sinceSave||0)+ui.remindEvery;});render();return;}
  if(e.target.id==='tsw-5n2j'){switchTo(e.target.value);return;}if(e.target.id==='path-pl-7q2m'){ui.pathPid=+e.target.value;render();return;}const el=e.target.closest('[data-ch]');if(!el)return;
  const k=el.dataset.ch,pid=+el.dataset.p,pl=S.players.find(p=>p.id===pid);
  if(k==='pname'&&pl)commit(()=>{pl.name=el.value.trim();});
  else if(k==='pflag'&&pl)commit(()=>{pl[el.dataset.f]=el.checked;});
  else if(k==='pseed'&&pl){const v=parseFloat(el.value);if(Number.isFinite(v)&&!playBegun())commit(()=>{pl.seed=v;});else render();}
  else if(k==='feesub')commit(()=>{S.feesSubmitted=el.checked;S.feesSubmittedAt=el.checked?nowIso():null;S.feesSubmittedAmt=el.checked?feeTotal():0;});
  else if(k==='paid')commit(()=>{if(el.checked)S.paid[pid]=true;else delete S.paid[pid];});
  else if(k==='set'){
    const f=el.dataset.k;
    if(f==='name')commit(()=>{S.name=el.value.trim()||'Determined Swiss';});
    else if(f==='clubName')commit(()=>{S.clubName=el.value.trim().slice(0,60);});
    else if(f==='numRounds'){if(!playBegun())commit(()=>{S.numRounds=+el.value===5?5:3;});else render();}
    else{const v=parseFloat(el.value);if(Number.isFinite(v)&&v>=0)commit(()=>{S[f]=v;});else render();}
  }
});
document.addEventListener('input',function(e){
  if(e.target.classList&&e.target.classList.contains('ntfee'))e.target.dataset.edited='1';
  if(e.target.id==='paste-box-1r6t')ui.paste=e.target.value;

});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='add-name-5h8e'){e.preventDefault();const b=document.querySelector('[data-act="add"]');if(b)b.click();}

function readTextFile(f){
  const rd=new FileReader();
  rd.onload=function(){
    try{importData(JSON.parse(String(rd.result)),f.name);}
    catch(err){flash('Could not open “'+f.name+'”: '+(err instanceof SyntaxError?'it is not a valid tournament file (the contents could not be read).':err.message));}
    render();
  };
  rd.onerror=function(){flash('Could not read that file.');render();};
  rd.readAsText(f);
}
/* Uses the browser's file picker (remembers the last folder) where supported; otherwise the standard file chooser. */
async function openPicker(){
  if(window.showOpenFilePicker&&window.top===window.self){
    try{
      const hs=await window.showOpenFilePicker({id:'ds-tournaments',multiple:false,types:[{description:'Tournament file',accept:{'application/json':['.json']}}]});
      if(hs&&hs[0])readTextFile(await hs[0].getFile());
      return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  $('openfile-7k2d').click();
}

/* Tooltip for “ⓘ How?” tags: hover, keyboard focus, or tap */
(function(){
  let box=null,cur=null;
  const hide=()=>{if(box){box.remove();box=null;}cur=null;};
  const show=el=>{
    if(cur===el)return;hide();cur=el;
    box=document.createElement('div');box.id='tipbox-4v8n';box.setAttribute('role','tooltip');box.textContent=el.getAttribute('data-tip')||'';
    document.body.appendChild(box);
    const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();
    let x=Math.min(Math.max(8,r.left),window.innerWidth-b.width-8),y=r.bottom+6;
    if(y+b.height>window.innerHeight-8)y=Math.max(8,r.top-b.height-6);
    box.style.left=x+'px';box.style.top=y+'px';
  };
  const tagOf=e=>e.target&&e.target.closest?e.target.closest('.howtag'):null;
  document.addEventListener('mouseover',e=>{const t=tagOf(e);if(t)show(t);});
  document.addEventListener('mouseout',e=>{if(tagOf(e))hide();});
  document.addEventListener('focusin',e=>{const t=tagOf(e);if(t)show(t);});
  document.addEventListener('focusout',e=>{if(tagOf(e))hide();});
  document.addEventListener('click',e=>{const t=tagOf(e);if(t){if(cur===t&&box&&e.detail===0)hide();else show(t);}else hide();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();});
  window.addEventListener('scroll',hide,true);
})();

    e.target.value='';render();
  };
  rd.onerror=function(){flash('Could not read that file.');render();};
  rd.readAsText(f);
});
render();
